# Source-of-truth schema for Core/Inc/MessagePassing/messages_private.h
#
# Firmware-internal inter-task queue payloads (not part of the USB wire contract).
# Section kinds and field options are documented in schema/messages_public.yaml and
# templates/header.h.j2.

guard: INC_MAIN_BOARD_MESSAGEPASSING_MESSAGES_PRIVATE_H_
includes:
  - stdint.h
  - stdbool.h
  - stdlib.h
  - stddef.h
  - { local: cmsis_os2.h }
  - { local: Config/config.h }
  - { local: messages_public.h }

sections:
  - kind: code
    text: |-
      #ifdef __cplusplus
      extern "C" {
      #endif

  - kind: enum
    name: display_screen_id
    base: uint32_t
    comment: |-
      Which screen the session controller's FSM is showing. The message below carries screen
      state, not draw commands: the FSM says what it is displaying and each display driver
      renders that however its panel allows. A 16x2 character LCD and a 320x240 TFT have no
      useful common drawing API -- the intersection caps the TFT at 16x2, the union is
      meaningless on the character LCD -- so the seam is here instead, at what the values mean.
    values:
      - { name: DISPLAY_SCREEN_IDLE,             value: "0", comment: "Attract screen; SELECT opens the settings menu" }
      - { name: DISPLAY_SCREEN_PID_ENABLE,       comment: "Settings: whether the PID option may be toggled in-session" }
      - { name: DISPLAY_SCREEN_DESIRED_RPM,      comment: "Settings: the desired-RPM setpoint" }
      - { name: DISPLAY_SCREEN_DESIRED_RPM_EDIT, comment: "Settings: the same setpoint with the digit cursor showing" }
      - { name: DISPLAY_SCREEN_SESSION,          comment: "Live readout while a session runs" }

  - { kind: static_assert, expr: "sizeof(display_screen_id) == 4", message: "Size of display_screen_id must be 4 bytes" }

  - kind: enum
    name: display_rpm_digit
    base: uint32_t
    comment: |-
      Which decimal digit of the desired RPM the encoder is editing. Mirrors
      State::DesiredRpmUnitsState in FiniteStateMachine.hpp. Sent as the cursor position
      rather than as the step size it implies, so a driver can mark the digit itself
      instead of only printing the increment.
    values:
      - { name: DISPLAY_RPM_DIGIT_TEN_THOUSAND, value: "0" }
      - { name: DISPLAY_RPM_DIGIT_THOUSAND }
      - { name: DISPLAY_RPM_DIGIT_HUNDRED }
      - { name: DISPLAY_RPM_DIGIT_TEN }
      - { name: DISPLAY_RPM_DIGIT_ONE }

  - { kind: static_assert, expr: "sizeof(display_rpm_digit) == 4", message: "Size of display_rpm_digit must be 4 bytes" }

  - kind: struct
    name: session_controller_to_display
    comment: |-
      Everything any screen shows, sent whole on every update. Drivers diff it against the
      last one they rendered and repaint only what moved -- which is what makes a 320x240
      panel viable at all, since a full frame over SPI costs ~50-100 ms but a single field
      costs ~1-2 ms. The older protocol sent ("  1234", row 0, col 3) and left the driver
      unable to tell which quantity had changed.
    fields:
      - { type: display_screen_id, name: screen, comment: "Which screen to render" }
      - { type: float,    name: rpm, comment: "Measured shaft speed in RPM, already converted from the encoder's rad/s" }
      - { type: float,    name: force,            comment: "Measured force in N" }
      - { type: float,    name: bpm_duty_cycle,   comment: "Commanded brake duty cycle, 0 - 1" }
      - { type: uint32_t, name: desired_rpm,      comment: "The PID setpoint being displayed or edited" }
      - { type: display_rpm_digit, name: cursor_digit, comment: "Digit the encoder edits (DESIRED_RPM_EDIT only)" }
      - { type: bool,     name: pid_enabled,           comment: "Whether the PID loop is armed for this session" }
      - { type: bool,     name: pid_option_toggleable, comment: "SYSCFG_PID_ENABLE: whether the menu allows arming it; also selects the in-session drive-mode field" }
      # Extended session detail. Carried for every panel but only shown by one: a 2x16 character
      # grid has no room for it, so LumexLCD ignores these and the ILI9341 draws them. See the
      # Show* methods on the DisplayDriver concept.
      - { type: float,    name: angular_acceleration, comment: "Measured angular acceleration in rad/s^2 (session screen detail)" }
      - { type: float,    name: peak_force,           comment: "Largest force magnitude seen this session, in N (session screen detail)" }
      - { type: uint32_t, name: session_seconds,      comment: "Seconds since the session started (session screen detail)" }

  - { kind: static_assert, expr: "sizeof(session_controller_to_display) <= 48", message: "session_controller_to_display is queued 25 deep -- keep it small" }

  - kind: enum
    name: session_controller_to_bpm_opcode
    base: uint32_t
    comment: |-
      Opcodes for controlling the BPM (Pulse Width Modulation) module from the session controller
    values:
      - { name: READ_FROM_PID, value: "0", comment: "read from PID Controller" }
      - { name: START_PWM, comment: "Start PWM output" }
      - { name: STOP_PWM,  comment: "Stop PWM output" }

  - { kind: static_assert, expr: "sizeof(session_controller_to_bpm_opcode) == 4", message: "Size of session_controller_to_bpm_opcode must be 4 bytes" }

  - kind: struct
    name: session_controller_to_bpm
    comment: |-
      Message sent from the session controller to the BPM module
    fields:
      - { type: session_controller_to_bpm_opcode, name: op, comment: "Operation to perform on the BPM" }
      - { type: float, name: new_duty_cycle_percent, comment: "New duty cycle percentage from 0 - 1" }

  - { kind: static_assert, expr: "sizeof(session_controller_to_bpm) == 4 + 4", message: "Size of session_controller_to_bpm must be 8 bytes" }

  - kind: struct
    name: session_controller_to_pid_controller
    comment: |-
      Message sent from the session controller to the PID controller
    fields:
      - { type: bool,  name: enable_status, comment: "Enable or disable the PID controller" }
      - { type: float, name: desired_angular_velocity, comment: "Desired motor RPM setpoint" }

  - { kind: static_assert, expr: "sizeof(session_controller_to_pid_controller) == 4 + 4", message: "Size of session_controller_to_pid_controller must be 8 bytes" }

  - kind: comment
    text: |-
      ---- USB host command routing (USB task <-> owning task) ------------------
      Largest command body the USB task will forward to a task (after the
      usb_cmd_header_t). Keep small; settings are a few bytes.

  - { kind: define, name: USB_TASK_CMD_BODY_MAX, value: "16" }

  - kind: comment
    text: |-
      A host setting routed from the USB task straight to the owning task's command
      queue. opcode/body are the task-local command; msg_id is the host correlation id
      (0 => firmware-internal, no host ack). The target task parses body by opcode.

  - kind: struct
    name: usb_task_command
    fields:
      - { type: uint16_t, name: opcode }
      - { type: uint16_t, name: msg_id }
      - { type: uint8_t,  name: body, array: USB_TASK_CMD_BODY_MAX }
      - { type: uint8_t,  name: body_len }

  - kind: comment
    text: |-
      A completion the owning task posts back (shared queue) once it has applied a
      command. The USB task drains these and frames a USB_MSG_RESPONSE to the host,
      echoing msg_id with the real status — the far end of the full-path ack. msg_id 0
      completions are dropped (internal commands the host never asked about).

  - kind: struct
    name: usb_task_completion
    fields:
      - { type: task_offset_t, name: task_offset, comment: "which module completed the command" }
      - { type: uint16_t, name: opcode }
      - { type: uint16_t, name: msg_id }
      - { type: uint32_t, name: status, comment: "usb_response_status_t" }

  - kind: code
    text: |-
      #ifdef __cplusplus
      }
      #endif
